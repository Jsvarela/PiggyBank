[project]
name = "finanzas-backend"
version = "0.1.0"
description = "API de finanzas personales"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

