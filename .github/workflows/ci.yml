name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    # Postgres real, igual que en producción (Neon). SQLite solo no basta: Postgres devuelve SUM() como
    # Decimal, exige otro driver y aplica las migraciones distinto.
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check .
      - name: Tests (SQLite, rápido)
        run: uv run pytest
      - name: Tests contra Postgres
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Migraciones en un Postgres limpio (subir, bajar y volver a subir)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migraciones
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE migraciones'
          uv run alembic upgrade head
          uv run alembic check   # falla si los modelos tienen cambios sin migración
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
