name: Respaldo semanal
# Descarga el respaldo JSON de tu app desplegada y lo guarda 90 días como "artifact" del repositorio.
# Solo corre si configuras los secretos APP_URL, BACKUP_EMAIL y BACKUP_PASSWORD (ver DEPLOY.md).
# El repositorio debe ser PRIVADO: el archivo contiene tus datos financieros.
on:
  schedule:
    - cron: "0 12 * * 0" # domingos 7 a. m. hora de Colombia
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar respaldo
        env:
          APP_URL: ${{ secrets.APP_URL }}
          BACKUP_EMAIL: ${{ secrets.BACKUP_EMAIL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ -z "$APP_URL" ]; then echo "::notice::Falta el secreto APP_URL: respaldo omitido"; exit 0; fi
          jar=$(mktemp)
          # El servidor gratuito puede estar dormido (~1 min): se reintenta hasta despertarlo.
          curl -sf --retry 8 --retry-delay 20 --retry-all-errors -c "$jar" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg e "$BACKUP_EMAIL" --arg p "$BACKUP_PASSWORD" '{email:$e,password:$p}')" \
            "$APP_URL/api/auth/login" -o /dev/null
          curl -sf --retry 3 -b "$jar" "$APP_URL/api/export/backup.json" -o respaldo.json
          jq -e '.version == 1' respaldo.json > /dev/null   # falla si no es un respaldo válido
      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-finanzas
          path: respaldo.json
          retention-days: 90
          if-no-files-found: ignore
